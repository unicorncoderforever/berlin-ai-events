name: Update events

on:
  schedule:
    # Every 2 days at 05:17 UTC (odd minute avoids the crowded on-the-hour queue)
    - cron: "17 5 */2 * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch feeds and rebuild events.json + events.ics
        run: node scripts/update-events.mjs

      - name: Commit if changed
        run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json events.ics
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh events.json ($(date -u +%Y-%m-%d))"
            git push
          fi
